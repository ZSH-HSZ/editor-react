<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片左右裁切/扩展</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
      }

      input[type='number'] {
        width: 100px;
        padding: 6px;
      }

      button {
        padding: 8px 16px;
        cursor: pointer;
      }

      .preview {
        display: inline-block;
        border: 1px solid #ccc;
        background: linear-gradient(45deg, #eee 25%, transparent 25%),
          linear-gradient(-45deg, #eee 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #eee 75%),
          linear-gradient(-45deg, transparent 75%, #eee 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        overflow: auto;
        max-width: 100%;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <input type="file" id="fileInput" accept="image/*" />

      <label>
        左裁切(px)
        <input type="number" id="leftCrop" value="0" />
      </label>

      <label>
        右裁切(px)
        <input type="number" id="rightCrop" value="0" />
      </label>

      <label>
        左透明扩展(px)
        <input type="number" id="leftPad" value="0" />
      </label>

      <label>
        右透明扩展(px)
        <input type="number" id="rightPad" value="0" />
      </label>

      <button id="downloadBtn">下载图片</button>
    </div>

    <div class="preview">
      <canvas id="canvas"></canvas>
    </div>

    <script>
      const fileInput = document.getElementById('fileInput')

      const leftCropInput = document.getElementById('leftCrop')
      const rightCropInput = document.getElementById('rightCrop')

      const leftPadInput = document.getElementById('leftPad')
      const rightPadInput = document.getElementById('rightPad')

      const downloadBtn = document.getElementById('downloadBtn')

      const canvas = document.getElementById('canvas')
      const ctx = canvas.getContext('2d')

      const image = new Image()

      let loaded = false

      fileInput.addEventListener('change', e => {
        const file = e.target.files[0]
        if (!file) return

        const reader = new FileReader()

        reader.onload = event => {
          image.onload = () => {
            loaded = true
            render()
          }

          image.src = event.target.result
        }

        reader.readAsDataURL(file)
      })

      ;[leftCropInput, rightCropInput, leftPadInput, rightPadInput].forEach(el => {
        el.addEventListener('input', render)
      })

      function render() {
        if (!loaded) return

        const leftCrop = Math.max(Number(leftCropInput.value) || 0, 0)
        const rightCrop = Math.max(Number(rightCropInput.value) || 0, 0)

        const leftPad = Math.max(Number(leftPadInput.value) || 0, 0)
        const rightPad = Math.max(Number(rightPadInput.value) || 0, 0)

        const sourceWidth = image.naturalWidth
        const sourceHeight = image.naturalHeight

        const cropWidth = sourceWidth - leftCrop - rightCrop

        if (cropWidth <= 0) {
          return
        }

        const finalWidth = cropWidth + leftPad + rightPad

        canvas.width = finalWidth
        canvas.height = sourceHeight

        ctx.clearRect(0, 0, finalWidth, sourceHeight)

        ctx.drawImage(
          image,
          leftCrop,
          0,
          cropWidth,
          sourceHeight,
          leftPad,
          0,
          cropWidth,
          sourceHeight
        )
      }

      downloadBtn.addEventListener('click', () => {
        if (!loaded) {
          alert('请先上传图片')
          return
        }

        const link = document.createElement('a')
        link.download = 'result.png'
        link.href = canvas.toDataURL('image/png')
        link.click()
      })
    </script>
  </body>
</html>
