<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>图片加渐变背景生成器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        background: #0f1220;
        color: #e6e7eb;
        padding: 24px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        background: #171a2a;
        border-radius: 16px;
        padding: 16px;
      }
      .controls {
        display: grid;
        gap: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      label {
        font-size: 12px;
        opacity: 0.9;
      }
      input[type='file'],
      select,
      input[type='range'],
      input[type='color'] {
        background: #0f1220;
        color: #e6e7eb;
        border: 1px solid #2a2f55;
        border-radius: 10px;
        padding: 8px 10px;
      }
      button {
        background: linear-gradient(135deg, #ffb347, #ff7eb3, #7f7cff);
        border: none;
        color: #0b0e1a;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .canvas-wrap {
        background: #0f1220;
        border-radius: 16px;
        padding: 12px;
        display: grid;
        place-items: center;
      }
      canvas {
        background: transparent;
        border-radius: 24px;
      }
      .tips {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>图片 + 渐变背景 生成器（App Icon 风格）</h1>
      <div class="panel">
        <div class="controls">
          <div class="row">
            <label>选择图片</label>
            <input id="file" type="file" accept="image/*" />
          </div>

          <div class="row">
            <label>画布尺寸</label>
            <select id="size">
              <option value="512">512 x 512</option>
              <option value="1024" selected>1024 x 1024（推荐）</option>
              <option value="2048">2048 x 2048</option>
            </select>
          </div>

          <div class="row">
            <label>渐变方向</label>
            <select id="angle">
              <option value="45">左上 → 右下</option>
              <option value="135">右上 → 左下</option>
              <option value="0">左 → 右</option>
              <option value="90">上 → 下</option>
            </select>
          </div>

          <div class="row">
            <label>渐变色 1</label>
            <input id="c1" type="color" value="#ffb347" />
            <label>渐变色 2</label>
            <input id="c2" type="color" value="#ff7eb3" />
            <label>渐变色 3</label>
            <input id="c3" type="color" value="#7f7cff" />
          </div>

          <div class="row">
            <label>主体缩放</label>
            <input id="scale" type="range" min="0.4" max="1" step="0.01" value="0.75" />
            <span id="scaleVal">0.75</span>
          </div>

          <div class="row">
            <label>外发光强度</label>
            <input id="glow" type="range" min="0" max="30" step="1" value="12" />
            <span id="glowVal">12</span>
          </div>

          <div class="row">
            <label>画布圆角</label>
            <input id="radius" type="range" min="0" max="25" step="1" value="8" />
            <span id="radiusVal">8%</span>
          </div>

          <div class="row">
            <button id="export">导出 PNG</button>
          </div>

          <div class="tips">小技巧：主体 PNG 透明背景效果最好；发光适度更高级。</div>
        </div>

        <div class="canvas-wrap">
          <canvas id="cv" width="1024" height="1024"></canvas>
        </div>
      </div>
    </div>

    <script>
      const file = document.getElementById('file')
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const sizeSel = document.getElementById('size')
      const angleSel = document.getElementById('angle')
      const c1 = document.getElementById('c1')
      const c2 = document.getElementById('c2')
      const c3 = document.getElementById('c3')
      const scale = document.getElementById('scale')
      const glow = document.getElementById('glow')
      const radius = document.getElementById('radius')
      const scaleVal = document.getElementById('scaleVal')
      const glowVal = document.getElementById('glowVal')
      const radiusVal = document.getElementById('radiusVal')
      const exportBtn = document.getElementById('export')

      let img = null

      function resizeCanvas() {
        const s = +sizeSel.value
        cv.width = s
        cv.height = s
        draw()
      }

      function makeGradient(angleDeg) {
        const rad = (angleDeg * Math.PI) / 180
        const cx = cv.width / 2,
          cy = cv.height / 2
        const len = Math.hypot(cv.width, cv.height)
        const x0 = cx - (Math.cos(rad) * len) / 2
        const y0 = cy - (Math.sin(rad) * len) / 2
        const x1 = cx + (Math.cos(rad) * len) / 2
        const y1 = cy + (Math.sin(rad) * len) / 2
        const g = ctx.createLinearGradient(x0, y0, x1, y1)
        g.addColorStop(0, c1.value)
        g.addColorStop(0.5, c2.value)
        g.addColorStop(1, c3.value)
        return g
      }

      function drawBackground() {
        ctx.clearRect(0, 0, cv.width, cv.height)
        ctx.fillStyle = makeGradient(+angleSel.value)
        const r = Math.min(cv.width, cv.height) * (+radius.value / 100) // 画布圆角（相对短边的比例）
        ctx.beginPath()
        ctx.moveTo(r, 0)
        ctx.arcTo(cv.width, 0, cv.width, cv.height, r)
        ctx.arcTo(cv.width, cv.height, 0, cv.height, r)
        ctx.arcTo(0, cv.height, 0, 0, r)
        ctx.arcTo(0, 0, cv.width, 0, r)
        ctx.closePath()
        ctx.fill()
      }

      function drawImageWithGlow() {
        if (!img) return
        const s = +scale.value
        const w = img.width * s
        const h = img.height * s
        const ratio = Math.min(cv.width / w, cv.height / h) * 0.9
        const dw = w * ratio
        const dh = h * ratio
        const dx = (cv.width - dw) / 2
        const dy = (cv.height - dh) / 2

        // 外发光
        ctx.save()
        ctx.shadowBlur = +glow.value
        ctx.shadowColor = c1.value
        ctx.drawImage(img, dx, dy, dw, dh)
        ctx.restore()

        // 正常主体
        ctx.drawImage(img, dx, dy, dw, dh)
      }

      function draw() {
        drawBackground()
        drawImageWithGlow()
      }

      file.addEventListener('change', e => {
        const f = e.target.files?.[0]
        if (!f) return
        const reader = new FileReader()
        reader.onload = () => {
          img = new Image()
          img.onload = draw
          img.src = reader.result
        }
        reader.readAsDataURL(f)
      })

      sizeSel.onchange = resizeCanvas
      ;[angleSel, c1, c2, c3, scale, glow, radius].forEach(el => (el.oninput = draw))

      scale.oninput = () => (scaleVal.textContent = scale.value)
      glow.oninput = () => (glowVal.textContent = glow.value)
      radius.oninput = () => (radiusVal.textContent = radius.value + '%')

      exportBtn.onclick = () => {
        const a = document.createElement('a')
        a.download = 'icon-gradient.png'
        a.href = cv.toDataURL('image/png')
        a.click()
      }

      resizeCanvas()
    </script>
  </body>
</html>
